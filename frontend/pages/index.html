<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Andy Price Memorial Archive</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../styles/styles.css" />
		<script src="../js/scripts.js" defer></script>
	</head>
	<body>
		<header>
			<a href="/"
				><h1>
					Andy Price <br />
					Memorial Archive
				</h1></a
			>
		</header>
		<main>
			<aside>
				<nav class="nav_bar">
					<a href="http://" target="_blank">Home</a>
					<a href="http://" target="_blank">All Images</a>
					<a href="http://" target="_blank">About</a>
				</nav>
				<div class="weight_wrapper">
					<label for="weight">Weight:</label>
					<div class="range_wrapper">
						<span>Old</span>
						<input
							type="range"
							id="weight"
							name="weight"
							min="0"
							max="1"
							value=""
							step="0.1"
							list="weight-ticks"
						/>
						<span>New</span>
					</div>
					<button id="button">Shuffle</button>
				</div>
			</aside>
			<section id="photo_grid"></section>
		</main>
		<footer>
			<p class="footer-content">© 2026 Andy Price</p>
		</footer>
	</body>
</html>
