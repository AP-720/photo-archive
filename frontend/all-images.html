<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Andy Price Memorial Archive</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles/styles.css" />
		<script src="js/allImages.js" type="module" defer></script>
	</head>
	<body>
		<main>
			<aside>
				<a href="index.html"
					><h1 class="header_title">
						Andy Price <br />
						Memorial Archive
					</h1></a
				>
				<nav class="nav_bar">
					<a href="index.html">Home</a>
					<a href="all-images.html">All Images</a>
					<a href="about.html">About</a>
				</nav>
				<div class="sort_wrapper">
					<p>Sort by:</p>
					<div>
						<label for="newest">Newest</label>
						<input
							type="radio"
							name="sort"
							id="newest"
							value="NEWEST"
							checked
						/>
					</div>
					<div>
						<label for="oldest">Oldest</label>
						<input type="radio" name="sort" id="oldest" value="OLDEST" />
					</div>
				</div>
			</aside>
			<section>
				<div id="error_message_container" role="alert"></div>
				<div id="photo_grid"></div>
				<div id="sentinel"></div>
			</section>
			<div id="loader_container">
				<div class="loader"></div>
			</div>
			<button id="to_top" title="Go to top" aria-label="Back to top">
				<svg
					viewBox="0 0 24 24"
					fill="none"
					xmlns="http://www.w3.org/2000/svg"
					id="Arrow-Up--Streamline-Solar-Ar"
					height="24"
					width="24"
				>
					<path
						d="m12 20 0 -16m0 0 6 6m-6 -6 -6 6"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="1.5"
					></path>
				</svg>
			</button>
		</main>
		<footer>
			<p class="footer-content">© 2026 Andy Price</p>
		</footer>
	</body>
</html>
